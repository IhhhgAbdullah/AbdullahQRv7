name: Build QR PiX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o qr_pix.zip -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android files and keep our code
        working-directory: extracted/qr_pix
        run: |
          mkdir -p ../keep
          cp -r lib assets pubspec.yaml ../keep/
          flutter create --project-name qr_pix --platforms android .
          rm -rf lib assets
          cp -r ../keep/lib ../keep/assets ../keep/pubspec.yaml .
          sed -i 's/android:label="[^"]*"/android:label="QR PiX"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.READ_MEDIA_IMAGES" /><application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/applicationId = "com.example.qr_pix"/applicationId = "com.abdullah.qr"/' android/app/build.gradle.kts
          sed -i '/^android {/a\    signingConfigs { getByName("debug") { storeFile = file("../../debug.keystore"); storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android" } }' android/app/build.gradle.kts
          sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle 2>/dev/null || true
          cat >> android/build.gradle.kts << 'GRADLE'
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          GRADLE
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          flutter pub get

      - name: Build debug APK
        working-directory: extracted/qr_pix
        run: flutter build apk --debug

      - name: Show SHA-1 fingerprint
        working-directory: extracted/qr_pix/android
        run: ./gradlew signingReport | grep SHA1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRPiX-debug-apk
          path: extracted/qr_pix/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
