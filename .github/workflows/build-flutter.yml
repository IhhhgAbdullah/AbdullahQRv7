name: Build QR PiX APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o qr_pix.zip -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android files and keep our code
        working-directory: extracted/qr_pix
        run: |
          mkdir -p ../keep
          cp -r lib assets pubspec.yaml ../keep/
          flutter create --project-name qr_pix --platforms android .
          rm -rf lib assets
          cp -r ../keep/lib ../keep/assets ../keep/pubspec.yaml .
          sed -i 's/android:label="[^"]*"/android:label="QR PiX"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.compileSdkVersion/36/' android/app/build.gradle.kts 2>/dev/null || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle 2>/dev/null || true
          cat >> android/build.gradle.kts << 'GRADLE'
          subprojects {
              afterEvaluate {
                  extensions.findByName("android")?.let { ext ->
                      (ext as com.android.build.gradle.BaseExtension).compileSdkVersion(36)
                  }
              }
          }
          GRADLE
          flutter pub get

      - name: Build debug APK
        working-directory: extracted/qr_pix
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QRPiX-debug-apk
          path: extracted/qr_pix/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
